<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="reset.css">
    <script src="main.js" defer></script>
    <title>Sign-Up Form</title>
</head>
<body>
    <main class="container">
        <section class="container__image">
            <div class="image--text">
                <span class="image--transparent">
                    <img class="image__logo" src="./assets/odin-lined.png" alt="A side header image of Odin with a hint to the Tamil word 'A'">
                    <h1 class="image__title" id="title">ODIN</h1>
                </span>
            </div>
            <div class="image--empty"></div>
        </section>
        <section class="container__form">
            <div class="description--container">
                <p class="form__description">This is a paragraph of something that <span class="italics">I</span> would want to put in the form explaining what the form is about or instructing the user on what to do.</p>
                <p class="form__description">What <span class="italics">this</span> form is about.</p>
            </div>
            <div class="form--container">
                <form id="registration-form" class="registration-form" action="/submit" method="post">
                    <h2 class="form--heading">Let's do this!</h2>
                    <div class="input--container">
                        <label for="first-name">FIRST NAME</label>
                        <input type="text" name="first-name" id="first-name" required>
                    </div>
                    <div class="input--container">
                        <label for="last-name">LAST NAME</label>
                        <input type="text" name="last-name" id="last-name" required>
                    </div>
                    <div class="input--container">
                        <label for="email">EMAIL</label>
                        <input type="email" name="email" id="email" required>
                    </div>
                    <div class="input--container">
                        <label for="phone-number">PHONE NUMBER</label>
                        <input type="tel" name="phone-number" id="phone-number" required>
                    </div>
                    <div class="input--container">
                        <label for="password">PASSWORD</label>
                        <input type="password" name="password" id="password" minlength="8" required>
                    </div>
                    <div class="input--container">
                        <label for="confirm-password">CONFIRM PASSWORD</label>
                        <input type="password" name="confirm-password" id="confirm-password" minlength="8" required>
                    </div>
                </form>
            </div>
            <div class="button--container">
                <button class="form--button" type="submit" for="registration-form">Create Account</button>
                <p class="form__para">Already have an account? <a class="link" href="https://" target="_blank" rel="noopener noreferrer">Log in</a></p>
            </div>
        </section>
    </main>
</body>
</html>
