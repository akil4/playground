<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="reset.css">
    <script src="main.js" defer></script>
    <title>Sign-Up Form</title>
</head>
<body>
    <main class="container">
        <section class="container__image">
            <img class="image" src="./assets/a.svg" alt="A side header image of Odin with a hint to the Tamil word 'A'">
            <h1 class="image__title" id="title">TAMIL</h1>
        </section>
        <section class="container__form">
            <p class="form__description"></p>
            <form class="form" action="#" method="post">
                <div class="form__container">
                    <h2 class="form__heading">Let's do this!</h2>
                    <label for="first-name">FIRST NAME</label>
                    <input type="text" name="first-name" id="first-name">
                    <label for="last-name">LAST NAME</label>
                    <input type="text" name="last-name" id="last-name">
                    <label for="email">EMAIL</label>
                    <input type="email" name="email" id="email">
                    <label for="phone-number">PHONE NUMBER</label>
                    <input type="tel" name="phone-number" id="phone-number">
                    <label for="password">PASSWORD</label>
                    <input type="password" name="password" id="password">
                    <label for="confirm-password">CONFIRM PASSWORD</label>
                    <input type="password" name="confirm-password" id="confirm-password">
                </div>
                <button class="form__button" type="submit">Create Account</button>
            </form>
            <p class="login">Already have an account? <a class="link" href="http://" target="_blank" rel="noopener noreferrer">Log in</a></p>
        </section>
    </main>
</body>
</html>
